# YuGang (大肥鱼): the QQ official bot platform callback.
#
# Install as /etc/nginx/sites-available/yugang.conf and symlink into
# sites-enabled. Only the signed callback is public; her tank page and HTTP
# channel stay on 127.0.0.1 and reach the operator through an SSH tunnel.
#
# The certificate is the existing wildcard one for *.dsh.kwelldo.cn, so the
# host must be a subdomain of it (ayu.dsh.kwelldo.cn here).

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ayu.dsh.kwelldo.cn;

    ssl_certificate     /etc/dsh-ssl/fullchain.pem;
    ssl_certificate_key /etc/dsh-ssl/key.pem;

    client_max_body_size 1m;
    access_log /var/log/nginx/yugang-qq-access.log;

    location = /qq/event {
        proxy_pass http://127.0.0.1:3196;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location / {
        return 404;
    }
}
